<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 table table-striped table-hover">
  <!-- Position Column -->
  <ng-container matColumnDef="count">
    <th mat-header-cell *matHeaderCellDef class="fs-6"> S.No. </th>
    <td mat-cell *matCellDef="let element; index as i;"> {{i + 1}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="firstName">
    <th mat-header-cell *matHeaderCellDef class="fs-6"> Product Name </th>
    <td mat-cell *matCellDef="let element"> {{element.FirstName}} </td>
  </ng-container>

   <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef class="fs-6"> Product Description </th>
    <td mat-cell *matCellDef="let element"> {{element.LastName}} </td>
  </ng-container>

   <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef class="fs-6"> Quantity </th>
    <td mat-cell *matCellDef="let element"> {{element.Email}} </td>
  </ng-container>

   <ng-container matColumnDef="number">
    <th mat-header-cell *matHeaderCellDef class="fs-6"> Unit Price </th>
    <td mat-cell *matCellDef="let element"> {{element.PhoneNumber}} </td>
  </ng-container>

   <ng-container matColumnDef="address">
    <th mat-header-cell *matHeaderCellDef class="fs-6"> Image </th>
    <td mat-cell *matCellDef="let element"> {{element.Address}} </td>
  </ng-container>

  <!-- Weight Column -->
  <!-- <ng-container matColumnDef="view">
    <th mat-header-cell *matHeaderCellDef class="fs-6"> Last Name </th>
    <td mat-cell *matCellDef="let element">
      <span *ngIf="element.View == 'True' " class="badge text-bg-success">Active</span>
      <span *ngIf="element.View == 'False' " class="badge text-bg-warning">InActive</span>
    </td>
  </ng-container> -->

  <!-- Symbol Column -->
  <!-- <ng-container matColumnDef="edit">
    <th mat-header-cell *matHeaderCellDef class="fs-6"> Edit </th>
    <td mat-cell *matCellDef="let element">
      <span *ngIf="element.Edit == 'True' " class="badge text-bg-success">Active</span>
      <span *ngIf="element.Edit == 'False' " class="badge text-bg-warning">InActive</span>
    </td>
  </ng-container> -->

  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef class="fs-6"> Action </th>
    <td mat-cell *matCellDef="let element">
      <button class="me-3 button-border" (click)="editUser(element)">
        <mat-icon class="text-primary">edit</mat-icon>
      </button>
      <button class="button-border" (click)="deleteUser(element)">
        <mat-icon class="text-danger">delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
